<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- No interactive-widget=resizes-content: on iOS 26 Safari the layout viewport then resizes
         for the keyboard while visualViewport.height subtracts the keyboard again, so the app sized
         to --vvh shrinks twice and the page background shows below the composer. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8f6f1" />
    <title>Agent Hub</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
