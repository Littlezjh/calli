<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- No interactive-widget=resizes-content: on iOS 26 Safari the layout viewport then resizes
         for the keyboard while visualViewport.height subtracts the keyboard again, so the app sized
         to --vvh shrinks twice and the page background shows below the composer. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8f6f1" />
    <title>Limi</title>
    <link rel="icon" href="/limi-icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/limi-icon.png" />
    <!-- The look chosen on this device, put on the page before the first paint so it never opens
         in the wrong colours. src/hooks.ts (useAppearance) takes over from here and checks the values. -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('rah.appearance') || '{}');
        var dark = saved.mode === 'dark' || (saved.mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (typeof saved.palette === 'string') document.documentElement.setAttribute('data-palette', saved.palette);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
