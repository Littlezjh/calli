<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calli 私人 agent · 墙（可交互草图）</title>
  <style>
    /* Tokens copied from packages/web/src/styles.css (paper), so the sketch opens on its own. */
    :root {
      --bg: #f8f6f1; --sidebar: #f1efe9; --surface: #ffffff; --surface-2: #fbfaf7;
      --text: #1f1e1c; --muted: #827f77; --faint: #a9a69e; --border: #e5e2da; --border-strong: #d6d2c8;
      --hover: rgba(31, 30, 28, 0.045); --active: rgba(31, 30, 28, 0.08);
      --accent: #1f1e1c; --accent-fg: #ffffff; --positive: #2f7d5b; --positive-bg: #e6f3eb;
      --user-bg: #eceae4; --code-bg: #efede7; --warn: #c2410c; --danger: #b42318; --danger-bg: #fdecea;
      --scrim: rgba(24, 23, 21, 0.32);
      --chart-total: #25805a; --chart-1: #2a78d6; --chart-2: #eb6834; --chart-3: #4a3aa7; --chart-4: #e34948;
      --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
      --shadow-pop: 0 14px 40px rgba(31, 30, 28, 0.14), 0 2px 6px rgba(31, 30, 28, 0.06);
      --shadow-card: 0 1px 2px rgba(31, 30, 28, 0.04), 0 6px 20px rgba(31, 30, 28, 0.05);
      --radius-pill: 999px; --radius-sm: 8px; --radius: 12px; --radius-lg: 18px; --radius-xl: 30px;
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
    }
    [data-theme='dark'] {
      --bg: #1c1b19; --sidebar: #171614; --surface: #252421; --surface-2: #211f1d;
      --text: #ecebe7; --muted: #9a978f; --faint: #6d6a63; --border: #34322e; --border-strong: #45423d;
      --hover: rgba(255, 255, 255, 0.05); --active: rgba(255, 255, 255, 0.09);
      --accent: #ecebe7; --accent-fg: #1c1b19; --positive: #5cb88d; --positive-bg: #1f3329;
      --user-bg: #2e2c29; --code-bg: #2a2825; --warn: #f0894e; --danger: #f07167; --danger-bg: #3a2220;
      --scrim: rgba(0, 0, 0, 0.5);
      --chart-total: #3f9a72; --chart-1: #3987e5; --chart-2: #d95926; --chart-3: #9085e9; --chart-4: #e66767;
      --shadow-pop: 0 14px 40px rgba(0, 0, 0, 0.45); --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; color: var(--text); background: var(--sidebar); font-family: var(--font); font-size: 14px; }
    button { font: inherit; cursor: pointer; color: inherit; border: 0; background: none; padding: 0; }
    button:focus-visible { outline: 2px solid var(--border-strong); outline-offset: 2px; border-radius: var(--radius-sm); }
    svg { flex: none; }

    /* Sketch chrome: not part of the product. */
    .bar { position: sticky; top: 0; z-index: 60; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      padding: 10px 20px; background: var(--sidebar); border-bottom: 1px solid var(--border); }
    .bar h1 { font-size: 13px; font-weight: 650; margin: 0 6px 0 0; color: var(--muted); }
    .seg { display: inline-flex; padding: 3px; border-radius: var(--radius-pill); background: var(--bg); border: 1px solid var(--border); }
    .seg button { padding: 5px 12px; border-radius: var(--radius-pill); font-size: 12.5px; color: var(--muted); }
    .seg button[aria-pressed='true'] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-card); font-weight: 600; }
    .stage { padding: 24px 20px 60px; display: flex; justify-content: center; }
    .device { width: 100%; max-width: 1240px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-lg);
      overflow: hidden; box-shadow: var(--shadow-card); position: relative; min-height: 720px; }
    .phone .device { max-width: 390px; min-height: 780px; border-radius: var(--radius-xl); }

    /* Page */
    .page { padding: 28px 32px 40px; }
    .phone .page { padding: 18px 16px 32px; }
    .head { display: flex; align-items: flex-end; gap: 16px; justify-content: space-between; flex-wrap: wrap; }
    .head h2 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
    .phone .head h2 { font-size: 19px; }
    .head .sum { margin-top: 6px; color: var(--muted); font-size: 13px; }
    .sum b { font-weight: 600; color: var(--text); }
    .sum .attn { color: var(--warn); font-weight: 600; }
    .tools { display: flex; gap: 8px; align-items: center; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: var(--radius-pill);
      border: 1px solid var(--border); background: var(--surface); font-size: 13px; }
    .btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
    .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    .icon-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: var(--radius-pill); color: var(--muted); }
    .icon-btn:hover { background: var(--hover); color: var(--text); }

    /* Morning / evening brief, one line */
    .brief { margin-top: 18px; display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: var(--radius);
      background: var(--surface); border: 1px solid var(--border); font-size: 13px; cursor: pointer; }
    .brief:hover { border-color: var(--border-strong); }
    .brief .time { color: var(--faint); font-variant-numeric: tabular-nums; }
    .brief .txt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brief-body { display: none; padding: 4px 14px 12px 14px; font-size: 13px; line-height: 1.7; color: var(--text); }
    .brief.open + .brief-body { display: block; }
    .brief-body ol { margin: 6px 0 0; padding-left: 20px; }
    .brief-body .m { color: var(--muted); }

    /* New findings */
    .finds { margin-top: 22px; }
    .sec-h { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); font-weight: 600; margin: 0 0 10px; }
    .sec-h .n { font-weight: 500; color: var(--faint); }
    .sec-h .grow { flex: 1; }
    .find-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
    .phone .find-row { flex-direction: column; overflow: visible; }
    .find { flex: 0 0 330px; padding: 12px 14px; border-radius: var(--radius); background: var(--surface-2);
      border: 1px dashed var(--border-strong); display: flex; flex-direction: column; gap: 8px; }
    .phone .find { flex-basis: auto; }
    .find .q { font-size: 13px; line-height: 1.55; }
    .find .q::before { content: '「'; color: var(--faint); }
    .find .q::after { content: '」'; color: var(--faint); }
    .find .src { font-size: 12px; color: var(--muted); }
    .find .why { font-size: 12px; color: var(--muted); }
    .find .acts { display: flex; gap: 6px; margin-top: 2px; }
    .chip { padding: 4px 10px; border-radius: var(--radius-pill); font-size: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
    .chip:hover { border-color: var(--border-strong); background: var(--hover); }
    .chip.solid { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    .chip.ghost { border-color: transparent; background: none; color: var(--muted); }
    .chip.ghost:hover { color: var(--text); }

    /* Four groups */
    .board { margin-top: 26px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: start; }
    .phone .board { grid-template-columns: 1fr; gap: 22px; }
    .col { min-width: 0; }
    .col-h { display: flex; align-items: baseline; gap: 6px; margin: 0 2px 10px; }
    .col-h h3 { margin: 0; font-size: 13.5px; font-weight: 650; }
    .col-h .n { color: var(--faint); font-size: 12.5px; font-variant-numeric: tabular-nums; }
    .col-h .hint { margin-left: auto; color: var(--faint); font-size: 12px; }
    .col.later .cards.closed { display: none; }
    .more { font-size: 12.5px; color: var(--muted); padding: 6px 2px; }
    .more:hover { color: var(--text); }
    .cards { display: flex; flex-direction: column; gap: 10px; }
    .empty { padding: 18px 12px; border: 1px dashed var(--border); border-radius: var(--radius); color: var(--faint); font-size: 12.5px; text-align: center; }

    .card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow-card); padding: 12px 14px 10px; transition: transform .18s ease, opacity .18s ease, border-color .15s; }
    .card:hover { border-color: var(--border-strong); }
    .card.leaving { opacity: 0; transform: translateY(-6px) scale(.98); }
    .card .t { font-size: 14px; line-height: 1.45; font-weight: 560; cursor: pointer; }
    .card .meta { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); }
    .card .meta .stale { color: var(--warn); }
    .card .meta .due { color: var(--warn); font-weight: 600; }
    .card .next { margin-top: 8px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
    .card .next b { font-weight: 600; color: var(--text); }
    .card .detail { display: none; margin-top: 10px; padding-left: 10px; border-left: 2px solid var(--border); font-size: 12.5px; line-height: 1.6; color: var(--muted); }
    .card.open .detail { display: block; }
    .detail .lbl { color: var(--faint); font-size: 11.5px; margin-top: 6px; }
    .detail .lbl:first-child { margin-top: 0; }
    .detail .quote { color: var(--text); }
    .card .acts { display: flex; gap: 2px; margin: 8px -6px 0; }
    .card .acts button { padding: 4px 8px; border-radius: var(--radius-sm); font-size: 12px; color: var(--faint); transition: color .12s; }
    .card:hover .acts button, .card:focus-within .acts button, .card.open .acts button, .phone .card .acts button { color: var(--muted); }
    .card .acts button:hover { background: var(--hover); color: var(--text); }
    .card .acts .sp { flex: 1; }
    .card.fresh { animation: pop .5s ease; }
    @keyframes pop { from { border-color: var(--text); } }
    .owner { display: inline-flex; align-items: center; gap: 4px; }

    /* Timeline wall */
    .tl { margin-top: 24px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-radius: var(--radius-lg);
      background:
        radial-gradient(circle at 1px 1px, var(--border-strong) 1px, transparent 1.4px) 0 0 / 14px 14px,
        var(--sidebar);
      border: 1px solid var(--border); min-height: 560px; overflow: hidden; }
    .phone .tl { grid-template-columns: 1fr; }
    .day { padding: 18px 16px 24px; border-right: 1px dashed var(--border-strong); min-width: 0; }
    .day:last-child { border-right: 0; }
    .phone .day { border-right: 0; border-bottom: 1px dashed var(--border-strong); }
    .label { display: inline-block; padding: 6px 14px; background: var(--surface); border-radius: var(--radius-sm); font-weight: 650; font-size: 14px;
      box-shadow: var(--shadow-card); transform: rotate(-1deg); }
    .label span { color: var(--muted); font-weight: 500; margin-left: 6px; }
    .pins { margin-top: 18px; display: flex; flex-direction: column; gap: 14px; }
    .note { position: relative; background: var(--surface); border-radius: var(--radius-sm); padding: 12px 14px; box-shadow: var(--shadow-card);
      border: 1px solid var(--border); cursor: pointer; transition: transform .15s; }
    .note:nth-child(odd) { transform: rotate(-0.8deg); }
    .note:nth-child(even) { transform: rotate(0.7deg); }
    .note:hover { transform: rotate(0deg) translateY(-2px); }
    .note::before { content: ''; position: absolute; top: -7px; left: 50%; width: 46px; height: 14px; margin-left: -23px;
      background: var(--user-bg); opacity: .9; border-radius: 2px; transform: rotate(-2deg); }
    .note h4 { margin: 0 0 6px; font-size: 13.5px; font-weight: 650; }
    .note ul { margin: 0; padding: 0; list-style: none; font-size: 12.5px; line-height: 1.7; color: var(--muted); }
    .note li { display: flex; gap: 6px; align-items: baseline; }
    .note li .k { flex: none; width: 14px; height: 14px; display: inline-grid; place-items: center; transform: translateY(2px); }
    .note li.done { color: var(--text); }
    .note .stack-n { position: absolute; top: 10px; right: 12px; font-size: 12px; color: var(--faint); }
    .note.big { padding: 14px 16px 16px; }
    .note.big .num { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
    .note.big .num small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 4px; }
    .note.big .bars { display: flex; gap: 3px; align-items: flex-end; height: 34px; margin-top: 8px; }
    .note.big .bars i { flex: 1; background: var(--border); border-radius: 2px; }
    .note.big .bars i.on { background: var(--muted); }
    .note.warm { background: var(--surface-2); }

    /* Panel / dialog */
    .scrim { position: absolute; inset: 0; background: var(--scrim); display: none; z-index: 30; }
    .scrim.show { display: block; }
    .panel { position: absolute; right: 24px; bottom: 24px; width: 420px; max-height: 76%; overflow: auto; z-index: 31; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); padding: 18px 20px 20px; display: none; }
    .panel.show { display: block; }
    .phone .panel { left: 10px; right: 10px; bottom: 10px; width: auto; max-height: 84%; }
    .panel h3 { margin: 0; font-size: 17px; font-weight: 650; }
    .panel .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
    .panel .x { position: absolute; top: 12px; right: 12px; }
    .ev { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); font-size: 13px; line-height: 1.5; }
    .ev:first-of-type { border-top: 0; }
    .ev .tm { width: 44px; flex: none; color: var(--faint); font-variant-numeric: tabular-nums; }
    .ev .what { flex: 1; min-width: 0; }
    .ev .src { color: var(--muted); font-size: 12px; }
    .report h4 { margin: 16px 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
    .report ul { margin: 0; padding-left: 18px; line-height: 1.75; font-size: 13.5px; }
    .report .from { color: var(--faint); font-size: 12px; }
    .panel .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

    /* Push preview */
    .pushes { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: min(380px, calc(100% - 20px)); z-index: 40; display: none; flex-direction: column; gap: 10px; }
    .pushes.show { display: flex; }
    .push { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); padding: 12px 14px; font-size: 13px; line-height: 1.55; }
    .push .ph { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .push b { font-weight: 650; }

    .toast { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); opacity: 0; transition: .2s; z-index: 50;
      background: var(--accent); color: var(--accent-fg); border-radius: var(--radius-pill); padding: 8px 8px 8px 16px; font-size: 13px; display: flex; gap: 12px; align-items: center; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
    .toast button { padding: 4px 10px; border-radius: var(--radius-pill); color: var(--accent-fg); opacity: .75; }
    .toast button:hover { opacity: 1; }

    .menu { position: absolute; z-index: 45; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-pop); padding: 4px; min-width: 150px; display: none; }
    .menu.show { display: block; }
    .menu button { display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: var(--radius-sm); font-size: 13px; }
    .menu button:hover { background: var(--hover); }
    .menu .m { color: var(--faint); font-size: 12px; float: right; }

    /* ---------- v2: charts, picture wall, keep ---------- */
    .tip { position: absolute; z-index: 55; pointer-events: none; background: var(--surface); color: var(--text); border: 1px solid var(--border);
      box-shadow: var(--shadow-pop); border-radius: var(--radius-sm); padding: 6px 9px; font-size: 12px; line-height: 1.45; display: none; white-space: nowrap; }
    .tip.show { display: block; }
    .tip b { font-weight: 650; font-variant-numeric: tabular-nums; }
    [data-tip] { cursor: default; }

    /* Week strip on the tracking wall */
    .week { margin-top: 14px; display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 10px; }
    .phone .week { grid-template-columns: 1fr; }
    .tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; min-width: 0; }
    .tile h5 { margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; gap: 8px; }
    .tile h5 .r { margin-left: auto; color: var(--faint); font-weight: 500; }
    .tile .hero { display: flex; align-items: flex-end; gap: 14px; margin-top: 6px; }
    .tile .hero .v { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
    .tile .hero .s { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .tile .hero .s .attn { color: var(--warn); }
    .spark { display: flex; gap: 3px; align-items: flex-end; height: 30px; margin-left: auto; }
    .spark i { width: 9px; border-radius: 3px 3px 0 0; background: var(--chart-total); }
    .spark i.future { background: var(--border); }
    .stack { display: flex; gap: 2px; height: 10px; margin-top: 12px; }
    .stack i { border-radius: 2px; }
    .stack i:first-child { border-radius: 4px 2px 2px 4px; }
    .stack i:last-child { border-radius: 2px 4px 4px 2px; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 12px; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { width: 8px; height: 8px; border-radius: 2px; }
    .legend b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    .rows { margin-top: 8px; display: grid; grid-template-columns: auto 1fr auto; gap: 5px 10px; align-items: center; font-size: 12px; }
    .rows .bar-t { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
    .rows .bar-t i { display: block; height: 100%; background: var(--muted); border-radius: 3px; }
    .rows .c { color: var(--muted); font-variant-numeric: tabular-nums; }

    /* Picture wall */
    .wall { margin-top: 22px; border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 22px 22px 30px;
      background: radial-gradient(circle at 1px 1px, var(--border-strong) 1px, transparent 1.4px) 0 0 / 14px 14px, var(--sidebar); }
    .phone .wall { padding: 16px 12px 24px; }
    .hero-card { display: grid; grid-template-columns: 1.35fr 1fr; gap: 0; background: var(--surface); border-radius: var(--radius); overflow: hidden;
      box-shadow: var(--shadow-card); border: 1px solid var(--border); cursor: pointer; }
    .phone .hero-card { grid-template-columns: 1fr; }
    .hero-card .art { min-height: 220px; background: var(--surface-2); border-right: 1px solid var(--border); position: relative; }
    .phone .hero-card .art { border-right: 0; border-bottom: 1px solid var(--border); }
    .hero-card .art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .hero-card .txt { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
    .hero-card .kick { font-size: 12px; color: var(--faint); }
    .hero-card h3 { margin: 0; font-size: 19px; font-weight: 650; line-height: 1.35; }
    .hero-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .hero-card .nums { display: flex; gap: 18px; margin-top: auto; }
    .hero-card .nums div { font-size: 12px; color: var(--muted); }
    .hero-card .nums b { display: block; font-size: 20px; color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }

    .days { margin-top: 26px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
    .phone .days { grid-template-columns: 1fr; }
    .dcol { padding: 0 14px; border-left: 1px dashed var(--border-strong); min-width: 0; }
    .dcol:first-child { border-left: 0; padding-left: 0; }
    .dcol:last-child { padding-right: 0; }
    .phone .dcol { border-left: 0; padding: 0 0 22px; }
    .dcol .pins { margin-top: 16px; display: flex; flex-direction: column; gap: 18px; }
    .pc { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-card);
      padding: 12px 14px; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
    .pc:nth-child(3n+1) { transform: rotate(-0.9deg); }
    .pc:nth-child(3n+2) { transform: rotate(0.6deg); }
    .pc:hover { transform: rotate(0) translateY(-2px); box-shadow: var(--shadow-pop); }
    .pc.tape::before { content: ''; position: absolute; top: -8px; left: 50%; width: 52px; height: 15px; margin-left: -26px; background: var(--user-bg);
      opacity: .92; border-radius: 2px; transform: rotate(-3deg); }
    .pc.pin::after { content: ''; position: absolute; top: -6px; right: 18px; width: 12px; height: 12px; border-radius: 50%;
      background: var(--border-strong); box-shadow: 0 2px 3px rgba(0, 0, 0, .18); }
    .pc h4 { margin: 0; font-size: 13.5px; font-weight: 650; }
    .pc .cap { margin-top: 6px; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .pc .badge { position: absolute; top: -12px; right: -10px; z-index: 3; background: var(--surface); border: 1px solid var(--border);

<script>
const I = {

function expChart(big) {
  const W = 300, H = big ? 170 : 128, L = 30, R = 50, T = 10, B = 20;
  const xs = (i) => L + i * (W - L - R) / 4, ys = (v) => T + (0.95 - v) / 0.2 * (H - T - B);
  const line = (arr) => arr.map((v, i) => v === null ? '' : `${i && arr[i - 1] !== null ? 'L' : 'M'}${xs(i)},${ys(v)}`).join('');
  const grid = [0.8, 0.85, 0.9].map((v) => `<line x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}" style="stroke:var(--border)" stroke-width="1"/>
    <text x="${L - 6}" y="${ys(v) + 3.5}" text-anchor="end" style="fill:var(--faint)" font-size="9.5">${v.toFixed(2)}</text>`).join('');
  const xl = exp.x.map((x, i) => `<text x="${xs(i)}" y="${H - 5}" text-anchor="middle" style="fill:var(--faint)" font-size="9.5">${x}</text>`).join('');
  const pts = (arr, c, name) => arr.map((v, i) => v === null ? '' : `<g data-tip="阈值 <b>${exp.x[i]}</b> · ${name} <b>${v.toFixed(2)}</b>">
      <circle cx="${xs(i)}" cy="${ys(v)}" r="10" fill="transparent"/><circle cx="${xs(i)}" cy="${ys(v)}" r="4" style="fill:${c};stroke:var(--surface)" stroke-width="2"/></g>`).join('');
  const gap = `<rect x="${xs(2) + 10}" y="${T}" width="${xs(4) - xs(2) - 4}" height="${H - T - B}" rx="4" style="fill:var(--surface-2);stroke:var(--border-strong)" stroke-dasharray="3 3"/>
    <text x="${(xs(3) + xs(4)) / 2 + 3}" y="${(H - B) / 2 + 6}" text-anchor="middle" style="fill:var(--warn)" font-size="10">超时，待重跑</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="阈值实验：准确率与召回率">
    ${grid}${xl}${gap}
    <path d="${line(exp.acc)}" fill="none" style="stroke:${C[0]}" stroke-width="2" stroke-linejoin="round"/>
    <path d="${line(exp.rec)}" fill="none" style="stroke:${C[1]}" stroke-width="2" stroke-linejoin="round"/>
    ${pts(exp.acc, C[0], '准确率')}${pts(exp.rec, C[1], '召回率')}
    <text x="${xs(0) + 4}" y="${ys(0.81) + 15}" style="fill:var(--muted)" font-size="10">准确率</text>
    <text x="${xs(0) + 4}" y="${ys(0.9) - 8}" style="fill:var(--muted)" font-size="10">召回率</text>
  </svg>
  <div class="legend"><span><i style="background:${C[0]}"></i>准确率</span><span><i style="background:${C[1]}"></i>召回率</span></div>`;
}

  if (kind === 'code') return `<div class="th dark">${[10, 22, 34, 46, 58, 70, 82].map((y, i) => L(8 + (i % 3) * 6, y, 30 + (i * 17) % 50)).join('')}</div>`;

function skillAction(id, act) {
  const k = skillCands.find((x) => x.id === id);
  if (act === 'steps') return showPanel(`${panelHead(esc(k.name), `会写成 ${k.path}`)}
    <div style="margin-top:12px">${k.flow.map((f, i) => `<div class="ev"><span class="tm">${i + 1}</span><div class="what">${esc(f)}</div></div>`).join('')}</div>
    <div class="sub" style="margin-top:8px">来自这几次：${k.evid}。生成后，任何 agent 遇到同类事都会照这个做。</div>`);
  skillCands = skillCands.filter((x) => x.id !== id);
  if (act === 'make') {
    owned.forEach((o) => { o.fresh = false; });
    const o = { name: k.name, uses: 0, last: '', path: k.path, fresh: true };
    owned.unshift(o);
    render();
    return toast(`已写入 ${k.path}`, () => { owned = owned.filter((x) => x !== o); skillCands.push(k); skillCands.sort((a, b) => a.id - b.id); render(); });
  }
  render();
  toast('不再提这件事', () => { skillCands.push(k); skillCands.sort((a, b) => a.id - b.id); render(); });
}

function openSpread(source, spec) {
  closeSpread(true);
  const from = source.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = `spread ${$('#stage').classList.contains('phone') ? 'phone-spread' : ''}`;
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-label', spec.title);
  el.innerHTML = `<div class="sh"><div class="tt"><h3>${esc(spec.title)}</h3>${spec.meta ? `<div class="mm">${spec.meta}</div>` : ''}${spec.next ? `<div class="nx"><b>下一步</b> · ${esc(spec.next)}</div>` : ''}</div>
      <div class="acts">${spec.acts || ''}<button class="icon-btn" data-close aria-label="收起">${I.x}</button></div></div>
    <div class="fan">${spec.cards.map(dcHtml).join('')}</div>`;
  document.body.appendChild(el);
  deskState.spread = { el, source, spec };
  const cx = from.left + from.width / 2, cy = from.top + from.height / 2;
  const cards = [...el.querySelectorAll('.dc')];
  cards.forEach((c) => {
    const r = c.getBoundingClientRect();
    c.style.transition = 'none';
    c.style.transform = `translate(${cx - (r.left + r.width / 2)}px, ${cy - (r.top + r.height / 2)}px) scale(.35) rotate(0deg)`;
    c.style.opacity = '0';
  });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.classList.add('show');
    cards.forEach((c, i) => { c.style.transition = ''; c.style.transitionDelay = `${i * 35}ms`; c.style.transform = ''; c.style.opacity = '1'; });
  }));
  el.querySelector('[data-close]').focus({ preventScroll: true });
}
function closeSpread(now) {
  const s = deskState.spread;
  if (!s) return;
  deskState.spread = null;
  if (now) return s.el.remove();
  const from = s.source.isConnected ? s.source.getBoundingClientRect() : null;
  s.el.querySelectorAll('.dc').forEach((c) => {
    c.style.transitionDelay = '0ms';
    if (from) { const r = c.getBoundingClientRect(); c.style.transform = `translate(${from.left + from.width / 2 - (r.left + r.width / 2)}px, ${from.top + from.height / 2 - (r.top + r.height / 2)}px) scale(.35)`; }
    c.style.opacity = '0';
  });
  s.el.classList.remove('show');
  setTimeout(() => s.el.remove(), 380);
  if (s.source.isConnected) s.source.focus({ preventScroll: true });
}
function refreshSpread() {
  const s = deskState.spread;
  if (!s) return;
  s.el.querySelector('.fan').innerHTML = s.spec.cards.map(dcHtml).join('');
}

    acts: `<button class="chip" data-pa="done">解决了</button><button class="chip" data-pa="touch">还在跟</button><button class="chip" data-pa="later">搁着</button><button class="chip" data-pa="agent">交给 agent</button>`,

function flash(id) {
  const el = document.querySelector(`[data-pile="${id}"].pl`);
  if (!el) return;
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });

}
function pileAction(id, act) {
  const p = piles.find((x) => x.id === id), before = { ...p }, idx = piles.indexOf(p);
  closeSpread();
  if (act === 'agent') return toast('会新开一个对话，把这件事和它的材料交过去');
  if (act === 'done') piles = piles.filter((x) => x !== p);
  if (act === 'touch') Object.assign(p, { age: 0 });
  if (act === 'later') Object.assign(p, { g: 'later' });
  setTimeout(render, 200);
  toast({ done: '已移到完成', touch: '记下了，3 天后再看', later: '已放进「搁着」' }[act], () => {
    if (act === 'done') piles.splice(idx, 0, p); else Object.assign(p, before);
    render();
  });
}

// Frames come from dsh-dafeiyu's assets/pet (MIT, PC2005-cloud), downloaded to ~/.calli/pets/dafeiyu,
// never committed here. Every other frame is kept, so each clip plays at 12 fps.
const maid = {
  base: 'pets/dafeiyu', counts: { idle: 241, thinking: 241, success: 241, poke: 241, head_pat: 241, idle_yawn: 241 },
  clip: 'idle', i: 0, loop: true, img: null, timer: null, then: null,
  src(clip, i) { return `${this.base}/${clip}/${clip}_${String(i * 2 + 1).padStart(3, '0')}.webp`; },
  frames(clip) { return Math.ceil(this.counts[clip] / 2); },
  bind(img) { this.img = img; this.draw(); if (!this.timer) this.start(); },
  play(clip, loop = false, then = 'idle') {
    this.clip = clip; this.i = 0; this.loop = loop; this.then = then;
    this.preload(clip);
  },
  preload(clip) { for (let i = 0; i < this.frames(clip); i++) { const im = new Image(); im.src = this.src(clip, i); } },
  draw() { if (this.img) this.img.src = this.src(this.clip, this.i); },
  start() {
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.preload('idle');
    if (still) return this.draw();
    this.timer = setInterval(() => {
      this.i += 1;
      if (this.i >= this.frames(this.clip)) {
        if (this.loop) this.i = 0; else { this.play(this.then, true); return; }
      }
      this.draw();
    }, 84);
    const yawn = () => { if (this.clip === 'idle') this.play('idle_yawn'); setTimeout(yawn, 40000 + Math.random() * 40000); };
    setTimeout(yawn, 30000);
  },
};
function renderPet() {
  let pet = document.querySelector('.pet');
  if (!pet) { pet = document.createElement('div'); pet.className = 'pet'; $('#stage').appendChild(pet); }
  const open = pet.classList.contains('open');
  pet.innerHTML = petHtml();
  if (open) pet.querySelector('textarea').value = renderPet.draft || '';
  maid.bind(pet.querySelector('.maid'));
  // Say it once, then get out of the way.
  clearTimeout(renderPet.h);
  renderPet.h = setTimeout(() => pet.querySelector('.say')?.remove(), 8000);
}
function petSend(text) {
  text = text.trim();
  if (!text) return;
  const pet = document.querySelector('.pet');
  pet.classList.remove('open');
  pet.classList.add('thinking');
  maid.play('thinking', true);
  renderPet.draft = '';
  setTimeout(() => {
    pet.classList.remove('thinking');
    maid.play('success');
    const hit = piles.find((p) => text.includes(p.t.slice(0, 3)));
    let id, msg;
    if (/做完|发了|搞定/.test(text) && hit) { piles = piles.filter((p) => p !== hit); msg = `把「${hit.t}」移到了完成`; }
    else if (hit) { hit.g = 'you'; hit.attn = true; hit.st = '你说很急'; id = hit.id; msg = `把「${hit.t}」挪到了「需要你」`; }
    else {
      const urgent = /急|今天|马上/.test(text);
      const t = text.replace(/^记一下[：:]?/, '').slice(0, 24);
      id = `u${Date.now()}`;
      piles.unshift({ id, g: urgent ? 'you' : 'doing', day: 0, t, who: '你自己', st: '刚记下', age: 0, next: '大肥鱼会在你空闲时问你下一步', cover: 'doc',
        cards: [{ k: 'check', r: -1, h: '你说的', list: [['', text]] }] });
      msg = `记下了，放进「${urgent ? '需要你' : '在跟'}」`;
    }
    render();
    if (id) setTimeout(() => flash(id), 50);
    toast(msg);
  }, 900);
}

document.addEventListener('click', (e) => {
  const t = e.target;
  if (t.closest('[data-pet-open]')) { const pet = t.closest('.pet'); if (!pet.classList.contains('open')) maid.play('poke'); pet.classList.add('open'); pet.querySelector('textarea').focus(); return; }
  if (t.closest('[data-pet-close]')) return t.closest('.pet').classList.remove('open');
  if (t.closest('[data-pet-send]')) return petSend($('#pet-in').value);
  const q = t.closest('[data-q]');
  if (q) { $('#pet-in').value = q.dataset.q; $('#pet-in').focus(); return; }
  const by = t.closest('#seg-by button');
  if (by) { deskState.by = by.dataset.v; return render(); }
  const sp = deskState.spread;
  if (sp && t.closest('.spread')) {
    if (t.closest('[data-close]') || !t.closest('.dc, .sh')) return closeSpread();
    const pa = t.closest('[data-pa]');
    if (pa) return pileAction(sp.spec.pid, pa.dataset.pa);
    const sk = t.closest('[data-sk]');
    if (sk) {
      const sid = +sk.closest('[data-sid]').dataset.sid, k = skillCands.find((x) => x.id === sid);
      skillCands = skillCands.filter((x) => x !== k);
      if (sk.dataset.sk === 'make') { owned.unshift({ name: k.name, uses: 0, last: '', path: k.path }); toast(`已写入 ${k.path}，哪个 agent 都能用`); }
      else toast('不再提这件事');
      if (sp.spec.shelf) sp.spec.cards = shelf.find((s) => s.id === sp.spec.shelf).cards();
      refreshSpread(); render(); return;
    }
    const fd = t.closest('[data-fd]');
    if (fd) {
      const fid = +fd.closest('[data-fid]').dataset.fid, f = finds.find((x) => x.id === fid);
      finds = finds.filter((x) => x !== f);
      if (fd.dataset.fd !== 'no') piles.unshift({ id: `f${f.id}`, g: fd.dataset.fd, day: 0, t: f.t, who: f.who, st: '刚加入', age: 0, next: '先确认要做到什么程度', cover: 'chat',
        cards: [{ k: 'chat', r: 1, msgs: [[f.who.slice(0, 1), f.q, f.src]] }] });
      toast(fd.dataset.fd === 'no' ? '已忽略，以后同类的少提' : `已放进「${fd.dataset.fd === 'you' ? '需要你' : '搁着'}」`);
      sp.spec.cards = finds.map((x) => ({ k: 'find', f: x }));
      render();
      if (!finds.length) return closeSpread(true);
      return refreshSpread();
    }
    const pull = t.closest('[data-pull], [data-drop]');
    if (pull) {
      const id = pull.dataset.pull || pull.dataset.drop;
      if (pull.dataset.pull) { piles.find((p) => p.id === id).g = 'doing'; toast('已放进「在跟」'); } else { piles = piles.filter((p) => p.id !== id); toast('不再跟踪'); }
      sp.spec.cards = piles.filter((p) => p.g === 'later').map((p) => ({ k: 'item', p }));
      render();
      if (!sp.spec.cards.length) return closeSpread(true);
      return refreshSpread();
    }
    return;
  }
  const pl = t.closest('[data-pile]');
  if (pl) { const p = piles.find((x) => x.id === pl.dataset.pile); const src = document.querySelector(`.pl[data-pile="${p.id}"]`) || pl; return openSpread(src, pileSpec(p)); }
  const sh = t.closest('[data-shelf]');
  if (sh) { const s = shelf.find((x) => x.id === sh.dataset.shelf); return openSpread(sh, { title: `沉淀 · ${s.t}`, meta: `<span style="font-family:var(--mono);font-size:12px">~/.calli/personal/${s.file}</span>`, cards: s.cards(), shelf: s.id }); }
  if (t.closest('[data-inbox]')) return openSpread(t.closest('[data-inbox]'), { title: '新发现', meta: '<span>空闲时从飞书和日历里找到的，点「跟踪」才上桌</span>', cards: finds.map((f) => ({ k: 'find', f })) });
  if (t.closest('[data-later]')) return openSpread(t.closest('[data-later]'), { title: '搁着', meta: '<span>不急，但不能丢</span>', cards: piles.filter((p) => p.g === 'later').map((p) => ({ k: 'item', p })) });
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && deskState.spread) closeSpread();
  if (e.key === 'Escape') document.querySelector('.pet')?.classList.remove('open');
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.pl')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'pet-in') petSend(e.target.value);
});
document.addEventListener('input', (e) => { if (e.target.id === 'pet-in') renderPet.draft = e.target.value; });

// Hover (and keyboard focus) tooltip for chart marks.
function showTip(el, x, y) {
  const tip = $('#tip');
  tip.innerHTML = el.dataset.tip || el.getAttribute('data-tip');
  tip.classList.add('show');
  tip.style.left = `${Math.min(Math.max(8, x + 12), innerWidth - tip.offsetWidth - 8)}px`;
  tip.style.top = `${y - tip.offsetHeight - 10}px`;
}
document.addEventListener('mousemove', (e) => {
  const el = e.target.closest?.('[data-tip]');
  if (el) showTip(el, e.clientX, e.clientY); else $('#tip').classList.remove('show');
});
document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]');
  if (go) document.querySelector(`#seg-view button[data-v="${go.dataset.go}"]`).click();
});

function toast(text, undoFn) {
  undo = undoFn || null;
  $('#toast-t').textContent = text;
  $('#toast-u').style.display = undoFn ? '' : 'none';
  $('#toast').classList.add('show');
  clearTimeout(toast.h);
  toast.h = setTimeout(() => $('#toast').classList.remove('show'), 3600);
}

function move(id, patch, text) {
  const it = items.find((i) => i.id === id);
  const before = { ...it };
  const el = document.querySelector(`.card[data-id="${id}"]`);
  const apply = () => {
    if (patch === null) items = items.filter((i) => i.id !== id); else Object.assign(it, patch);
    render();
    const again = document.querySelector(`.card[data-id="${id}"]`);
    if (again && patch && patch.g !== before.g) again.classList.add('fresh');
  };
  if (el) { el.classList.add('leaving'); setTimeout(apply, 160); } else apply();
  toast(text, () => {
    if (patch === null) items.push(before); else Object.assign(it, before);
    items.sort((a, b) => a.id - b.id);
    render();
  });
}

function openMenu(anchor, entries) {
  const m = $('#menu');
  m.innerHTML = entries.map(([label, hint], i) => `<button data-i="${i}">${label}${hint ? `<span class="m">${hint}</span>` : ''}</button>`).join('');
  const d = $('#device').getBoundingClientRect(), r = anchor.getBoundingClientRect();
  m.classList.add('show');
  const left = Math.min(r.left - d.left, d.width - m.offsetWidth - 10);
  m.style.left = `${Math.max(10, left)}px`;
  const below = r.bottom - d.top + 4, above = r.top - d.top - m.offsetHeight - 4;
  m.style.top = `${below + m.offsetHeight > d.height - 10 && above > 10 ? above : below}px`;
  m.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; m.classList.remove('show'); entries[+b.dataset.i][2](); };
}

function showPanel(html) { $('#panel').innerHTML = html; $('#panel').classList.add('show'); $('#scrim').classList.add('show'); }
function hidePanel() { $('#panel').classList.remove('show'); $('#scrim').classList.remove('show'); }

function reportHtml() {
  const doing = items.filter((i) => (i.g === 'doing' || i.g === 'you') && !i.t.includes('周报'));
  const wait = items.filter((i) => i.g === 'wait');
  return `<button class="icon-btn x" id="close-panel" aria-label="关闭">${I.x}</button>
    <h3>周报草稿</h3><div class="sub">按本周墙上的事排的 · 周五 15:30 你空闲时生成</div>
    <div class="report">
      <h4>本周进展</h4><ul>
        <li>阈值实验跑完两组，第三组重跑中；结论今天同步 <span class="from">· 阈值实验</span></li>
        <li>记忆重构完成 6/9 个调用方，旧接口加了兼容层 <span class="from">· 记忆重构</span></li>
        <li>排序改动合入，修了两个评测脚本的问题 <span class="from">· 排序</span></li>
        <li>通过稳定性评审 <span class="from">· 日历</span></li>
      </ul>
      <h4>卡点</h4><ul>${wait.map((i) => `<li>${esc(i.t)}（${staleText(i.age)}）<span class="from">· ${esc(i.who)}</span></li>`).join('')}</ul>
      <h4>下周</h4><ul>${doing.slice(0, 4).map((i) => `<li>${esc(i.t)}</li>`).join('')}</ul>
    </div>
    <div class="foot"><button class="btn" id="close-panel-2">关闭</button><button class="btn primary" id="copy-report">复制</button></div>`;
}

function dayHtml(di) {
  const d = days[di];
  return `<button class="icon-btn x" id="close-panel" aria-label="关闭">${I.x}</button>
    <h3>${d.label ? `${d.label} · ` : ''}${d.date}</h3><div class="sub">${d.events.length} 件事</div>
    <div style="margin-top:10px">${d.events.map(([tm, w, s]) => `<div class="ev"><span class="tm">${tm}</span><div class="what">${esc(w)}<div class="src">${esc(s)}</div></div></div>`).join('')}</div>`;
}

function pushesHtml() {
  return `<div class="push"><div class="ph"><span>Calli · 早报</span><span>09:02</span></div>
      <b>今天 3 件要注意</b><br>① 阈值结论今天发老板　② PM 的问题 2 天没回　③ 周报 18:00 交<br><span style="color:var(--muted)">另有 2 件等别人，下午替你看。</span></div>
    <div class="push"><div class="ph"><span>Calli · 晚报</span><span>19:00</span></div>
      <b>今天推进 3 件，2 件没动</b><br>没动的：OKR 自评（5 天）、PM 的问题。<br><span style="color:var(--muted)">明天先回 PM，一句话就行。</span></div>`;
}

document.addEventListener('click', (e) => {
  const t = e.target;
  if (!t.closest('#menu') && !t.closest('[data-a="snooze"]') && !t.closest('[data-a="more"]')) $('#menu').classList.remove('show');
  if (t.closest('#close-panel') || t.closest('#close-panel-2') || t.closest('#scrim')) return hidePanel();
  if (t.closest('#copy-report')) { hidePanel(); return toast('已复制周报草稿'); }
  if (t.closest('#open-report')) return showPanel(reportHtml());
  if (t.closest('#toast-u')) { $('#toast').classList.remove('show'); if (undo) undo(); return; }
  if (t.closest('#brief')) { state.briefOpen = !state.briefOpen; return render(); }
  if (t.closest('#later-toggle')) { state.laterOpen = !state.laterOpen; return render(); }
  const pk = t.closest('[data-panel]');
  if (pk) return showPanel(panels[pk.dataset.panel]());
  const sk = t.closest('[data-skill]');
  if (sk) return skillAction(+sk.closest('.skill').dataset.sid, sk.dataset.skill);

  const fb = t.closest('[data-f]');
  if (fb) {
    const id = +fb.closest('.find').dataset.fid, f = finds.find((x) => x.id === id), kind = fb.dataset.f;
    finds = finds.filter((x) => x.id !== id);
    if (kind !== 'no') items.push({ id: f.id, g: kind, t: f.t, who: f.who, src: f.src, age: 0, next: '先确认要做到什么程度', quote: f.q, note: '' });
    render();
    const msg = kind === 'no' ? '已忽略，以后同类的少提' : kind === 'you' ? '已放进「需要你」' : '已放进「搁着」';
    return toast(msg, () => { finds.push(f); finds.sort((a, b) => a.id - b.id); items = items.filter((i) => i.id !== f.id); render(); });
  }

  const card = t.closest('.card');
  if (!card) return;
  const id = +card.dataset.id;
  const a = t.closest('[data-a]');
  if (!a) {
    if (t.closest('.t')) { state.open.has(id) ? state.open.delete(id) : state.open.add(id); render(); }
    return;
  }
  const act = a.dataset.a;
  if (act === 'done') return move(id, null, '已移到完成');
  if (act === 'drop') return move(id, null, '不再跟踪');
  if (act === 'pull') return move(id, { g: 'doing', age: 0 }, '已放进「在跟」');
  if (act === 'touch') return move(id, { age: 0 }, '记下了，3 天后再看');
  if (act === 'snooze') return openMenu(a, [
    ['明天再看', '周六 09:00', () => move(id, { g: 'later' }, '明天早报里再提')],
    ['下周一', '11/3', () => move(id, { g: 'later' }, '周一早报里再提')],
    ['这周不管', '', () => move(id, { g: 'later' }, '已放进「搁着」')],
  ]);
  if (act === 'more') return openMenu(a, [
    ['卡在别人那里', '', () => move(id, { g: 'wait' }, '已放进「等别人」')],
    ['交给 agent 去做', '', () => toast('会新开一个对话，把这件事交过去')],
    ['不管了', '', () => move(id, null, '不再跟踪')],
  ]);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { hidePanel(); $('#menu').classList.remove('show'); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card .t, #brief')) { e.preventDefault(); e.target.click(); }
});

function seg(id, fn) {
  document.querySelectorAll(`#${id} button`).forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll(`#${id} button`).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    fn(b.dataset.v);
  }));
}
seg('seg-view', (v) => { state.view = v; hidePanel(); closeSpread(true); render(); });
seg('seg-theme', (v) => { document.documentElement.dataset.theme = v; });
seg('seg-size', (v) => { $('#stage').classList.toggle('phone', v === 'phone'); });
seg('seg-push', (v) => { $('#pushes').innerHTML = pushesHtml(); $('#pushes').classList.toggle('show', v === 'on'); });

const q = new URLSearchParams(location.search);
for (const [k, id] of [['view', 'seg-view'], ['theme', 'seg-theme'], ['size', 'seg-size'], ['push', 'seg-push']]) {
  const v = q.get(k); if (v) document.querySelector(`#${id} button[data-v="${v}"]`)?.click();
}
render();
</script>
